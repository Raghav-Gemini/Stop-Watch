<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="heading">
        <h1>STOPWATCH</h1>
    </div>

    <div class="stopWatch">
        <div class="timer">00:00:00</div>
    </div>

    <div class="btns">
        <button class="btn" style="background-color: blue;" id="start">START</button>
        <button class="btn" style="background-color: red;" id="stop">STOP</button>
        <button class="btn" style="background-color: lightgray;" id="reset">RESET</button>
        <button class="btn" style="background-color: lightcoral" id="lap">LAP</button>
        <button class="btn" style="background-color: blue;" id="resume">RESUME</button>
    </div>
    <ul id="laps"></ul>
    <script src="script.js"></script>
</body>

</html>
